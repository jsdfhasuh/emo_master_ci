name: Isolated private source transfer fixture (no product execution)
run-name: source-fixture ${{ inputs.mode }} ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [receive, relay]}
      nonce: {type: string, required: true}
      sealed: {type: string, required: false}
permissions: {}
concurrency:
  group: source-fixture-${{ inputs.mode }}-${{ inputs.nonce }}
  cancel-in-progress: false
jobs:
  fixture:
    if: >-
      github.repository_id == '1468905732' && github.actor_id == '49879362' &&
      github.run_attempt == '1' && github.ref_type == 'tag' &&
      github.ref_name == vars.SOURCE_FIXTURE_TAG && github.sha == vars.SOURCE_FIXTURE_WORKER_SHA
    permissions: {contents: read, actions: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APPROVED_SHA: ${{ vars.SOURCE_FIXTURE_WORKER_SHA }}
      APPROVED_TAG: ${{ vars.SOURCE_FIXTURE_TAG }}
      APPROVED_WORKFLOW_ID: ${{ vars.SOURCE_FIXTURE_WORKFLOW_ID }}
      NONCE: ${{ inputs.nonce }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ci-source
      - if: inputs.mode == 'receive'
        run: python3 ci-source/receive_fixture.py key
      - if: inputs.mode == 'receive'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recipient-${{ inputs.nonce }}
          path: ${{ runner.temp }}/source-fixture/recipient.pem
          if-no-files-found: error
          retention-days: 1
      - if: inputs.mode == 'receive'
        run: python3 ci-source/receive_fixture.py receive
        env:
          PUBLIC_READ_TOKEN: ${{ github.token }}
      - if: inputs.mode == 'receive'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: received-${{ inputs.nonce }}
          path: ${{ runner.temp }}/source-fixture/proof.json
          if-no-files-found: error
          retention-days: 1
      - if: inputs.mode == 'relay'
        run: python3 ci-source/receive_fixture.py relay
        env:
          SEALED: ${{ inputs.sealed }}
      - if: inputs.mode == 'relay'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-${{ inputs.nonce }}
          path: ${{ runner.temp }}/source-fixture/sealed.der
          if-no-files-found: error
          retention-days: 1
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/source-fixture"
