name: Windows SQLite threshold control, isolated V2 diagnostic
on:
  push:
    branches: [dot/mainline-ci-migration-20261124]
    paths: [.github/workflows/sqlite-threshold-v2-proof.yml]
concurrency:
  group: windows-sqlite-threshold-controls-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  control:
    if: github.repository == 'jsdfhasuh/emo_master_ci' && github.repository_id == '1468905732' && github.ref == 'refs/heads/dot/mainline-ci-migration-20261124'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 770bfad99c7027077c4231946b2e0ea82ba3a0fa
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
      - id: bootstrap
        name: Install digest-pinned Windows age and validate V2 recipient
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          import hashlib, io, os, re, zipfile
          from pathlib import Path
          from urllib.request import urlopen
          recipient = os.environ["RECIPIENT"]
          if not re.fullmatch(r"age1[023456789ac-hj-np-z]{58}", recipient) or hashlib.sha256(recipient.encode("ascii")).hexdigest() != "ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87":
              raise SystemExit("sqlite_threshold_v2=recipient_mismatch")
          try:
              with urlopen("https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-windows-amd64.zip", timeout=50) as response:
                  data = response.read(12 * 1024 * 1024 + 1)
              if hashlib.sha256(data).hexdigest() != "46db0db71f146061f7c8fffa912cb806aef1bc8450e27a3abc1744f0591b89fb":
                  raise ValueError
              with zipfile.ZipFile(io.BytesIO(data)) as bundle:
                  (Path(os.environ["RUNNER_TEMP"]) / "sqlite-threshold-age.exe").write_bytes(bundle.read("age/age.exe"))
          except Exception:
              raise SystemExit("sqlite_threshold_v2=tool_install_failed") from None
      - name: Run exact isolated threshold control with original supervisor
        id: workload
        shell: python
        run: |
          import json, os, subprocess, sys, time
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          status, stage = "failure", "identity"
          deadline = time.monotonic() + 10 * 60
          def run(args, name):
              with (root / name).open("xb") as log:
                  child = subprocess.Popen([sys.executable, *args], stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
                  try:
                      return child.wait(timeout=max(0.01, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      with open(os.devnull, "wb") as quiet:
                          subprocess.run([os.path.join(os.environ["SystemRoot"], "System32", "taskkill.exe"), "/PID", str(child.pid), "/T", "/F"],
                                         stdin=subprocess.DEVNULL, stdout=quiet, stderr=quiet, timeout=15, check=False)
                      if child.poll() is None:
                          child.kill()
                      child.wait(timeout=10)
                      return 124
          controls_rc = validation = None
          try:
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True, stderr=subprocess.DEVNULL).strip()
              if head != os.environ["SOURCE_SHA"]:
                  raise ValueError
              stage = "dependencies"
              rc = run(["-m", "pip", "install", "-r", "requirements-dev.txt"], "sqlite-threshold-dependencies.log")
              if rc == 0:
                  stage = "isolated_threshold"
                  rc = run(["-c", "import json, os, sys\nfrom pathlib import Path\nfrom scripts import r3_sqlite_controls as control\nrepo=Path.cwd()\nout=Path(os.environ[\"RUNNER_TEMP\"])/\"sqlite-threshold-control-evidence\"\nout.mkdir(exist_ok=False)\ncase=\"threshold_eligible_commit_then_reuse\"\nif control.CASES[4] != case: raise ValueError\nexecution=control.run_child([sys.executable,str(repo/\"scripts/r3_sqlite_controls.py\"),\"--repo\",str(repo),\"--output\",str(out),\"--worker-case\",case],out,timeout=30.0)\n(out/\"supervisor.json\").write_text(json.dumps(execution,ensure_ascii=True),encoding=\"ascii\")\nraise SystemExit(0 if execution.get(\"status\")==\"EXITED\" and execution.get(\"returncode\")==0 and execution[\"cleanup\"][\"process_reaped\"] and execution[\"cleanup\"][\"output_reader_joined\"] else 1)"], "sqlite-threshold-observed.log")
                  controls_rc = rc
              status = "success" if rc == 0 else "expired" if rc == 124 else "failure"
          except Exception:
              pass
          (root / "sqlite-threshold-status.json").write_text(json.dumps({"status": status, "stage": stage, "controls_rc": controls_rc, "validation_rc": validation}), encoding="ascii")
          print("sqlite_threshold_v2=" + status)
          sys.exit(status != "success")
      - name: Seal bounded V2 evidence without a plaintext archive
        id: seal
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
          ORIGINAL_OUTCOME: ${{ steps.workload.outcome }}
        run: |
          import hashlib, io, json, os, re, stat, subprocess, tarfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          evidence = root / "sqlite-threshold-control-evidence"
          mib = 1024 * 1024
          caps = {"result.json": 256*1024, "worker.log": 768*1024, "supervisor.json": 64*1024}
          allowed = {n: (evidence / n, cap, False) for n, cap in caps.items()}
          allowed.update({"stage-report.json": (root / "sqlite-threshold-status.json", 2048, False),
                          "dependencies.log": (root / "sqlite-threshold-dependencies.log", 512*1024, True),
                          "observed.log": (root / "sqlite-threshold-observed.log", mib, True)})
          output = root / "sqlite-threshold-evidence.tar.age"
          def bounded(path, cap, tail):
              try:
                  original = path.lstat()
              except FileNotFoundError:
                  return None
              if not stat.S_ISREG(original.st_mode) or original.st_nlink != 1 or getattr(original, "st_file_attributes", 0) & 0x400:
                  raise ValueError
              for parent in path.parents:
                  attr = parent.lstat()
                  if not stat.S_ISDIR(attr.st_mode) or getattr(attr, "st_file_attributes", 0) & 0x400:
                      raise ValueError
              with path.open("rb") as handle:
                  current = os.fstat(handle.fileno())
                  if not os.path.samestat(original, current) or current.st_size > cap and not tail:
                      raise ValueError
                  marker = b"[leading bytes omitted]\n"
                  if current.st_size > cap:
                      handle.seek(current.st_size - cap + len(marker))
                      return marker + handle.read(cap - len(marker))
                  data = handle.read(cap+1)
                  if len(data) != current.st_size:
                      raise ValueError
                  return data
          try:
              recipient = os.environ["RECIPIENT"]
              assert re.fullmatch(r"age1[023456789ac-hj-np-z]{58}", recipient)
              assert hashlib.sha256(recipient.encode("ascii")).hexdigest() == "ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87"
              meta = dict(version=1, encryption_profile="V2", suite_family="diagnostics",
                          source_sha=os.environ["SOURCE_SHA"], workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
                          run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                          repository_id=os.environ["GITHUB_REPOSITORY_ID"], job="isolated-sqlite-threshold-control",
                          outcome=os.environ["ORIGINAL_OUTCOME"], packager_sha="", files={})
              payloads = {n: data for n, (p, cap, tail) in allowed.items() if (data := bounded(p, cap, tail)) is not None}
              if "stage-report.json" not in payloads and meta["outcome"] != "success":
                  payloads["stage-report.json"] = json.dumps({"status": "incomplete", "outcome": meta["outcome"]}).encode("ascii")
              assert "stage-report.json" in payloads
              if meta["outcome"] == "success":
                  assert all(n in payloads for n in caps) and all(payloads[n] for n in caps if n.endswith(".json"))
                  assert sum(len(payloads[n]) for n in caps) <= 2*mib
                  for name in caps:  # Same strict UTF-8 check as original; never print the decoded text.
                      payloads[name].decode("utf-8", errors="strict")
              assert sum(map(len, payloads.values())) <= 4*mib
              with subprocess.Popen([str(root / "sqlite-threshold-age.exe"), "-r", recipient, "-o", str(output)],
                                    stdin=subprocess.PIPE, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) as child:
                  with child.stdin as pipe, tarfile.open(fileobj=pipe, mode="w|") as archive:
                      for name, content in sorted(payloads.items()):
                          meta["files"][name] = dict(size=len(content), sha256=hashlib.sha256(content).hexdigest())
                      payloads["manifest.json"] = json.dumps(meta, sort_keys=True).encode("ascii")
                      for name, content in sorted(payloads.items()):
                          member = tarfile.TarInfo(name)
                          member.size, member.mode = len(content), 0o600
                          archive.addfile(member, io.BytesIO(content))
                  if child.wait(timeout=45) != 0:
                      raise ValueError
              with output.open("rb") as encrypted:
                  if encrypted.readline(64) != b"age-encryption.org/v1\n":
                      raise ValueError
          except Exception:
              output.unlink(missing_ok=True)
              raise SystemExit("sqlite_threshold_v2=seal_failed") from None
      - name: Retain ciphertext only
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sqlite-threshold-v2-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-threshold-evidence.tar.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

