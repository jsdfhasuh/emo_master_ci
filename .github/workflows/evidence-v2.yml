name: Synthetic V2 recovery canary (manual)
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Fresh 32 lowercase hex digits from offline operator
        required: true
        type: string
permissions: {}
jobs:
  encrypt:
    if: github.repository == 'jsdfhasuh/emo_master_ci' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install reviewed age binary
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          cd "$RUNNER_TEMP"
          # Immutable release URL; verify pinned release bytes.
          expected=7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 60 -o age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          printf '%s  age.tgz\n' "$expected" | sha256sum --status -c -
          tar -xzOf age.tgz age/age > age-v2
          chmod 500 age-v2
      - name: Encrypt only the synthetic canary
        shell: bash
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ "$RECIPIENT" =~ ^age1[0-9a-z]{58}$ && "$NONCE" =~ ^[0-9a-f]{32}$ ]]
          cd "$RUNNER_TEMP"
          printf 'ci-evidence-v2:%s\n' "$NONCE" | ./age-v2 -r "$RECIPIENT" -o canary.age
      - name: Upload synthetic ciphertext
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-v2-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary.age
          if-no-files-found: error
          retention-days: 7
