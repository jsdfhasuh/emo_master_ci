name: Event-bound Windows frozen package (dark pilot)
run-name: emo-ci-candidate-${{ inputs.receipt_key }}
on:
  workflow_dispatch:
    inputs:
      receipt_key:
        description: Opaque exact broker request SHA-256 (not credentials)
        required: true
        type: string
      request:
        required: true
        type: string
permissions:
  contents: read
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execution_sha: ${{ steps.verify.outputs.execution_sha }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
    steps:
      - name: Reject unreviewed caller before checkout
        if: >-
          ${{ !(github.repository == 'jsdfhasuh/emo_master_ci' && github.repository_id == '1468905732' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/ci-worker-designer-validation-recovery-20261127' && github.workflow_ref == 'jsdfhasuh/emo_master_ci/.github/workflows/dispatch-windows-package-candidate.yml@refs/tags/ci-worker-designer-validation-recovery-20261127' && github.actor_id == '49879362' && github.run_attempt == '1') }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Verify trusted source event and exact commit
        id: verify
        env:
          WORKER_ROUTE: windows-package
          WORKER_REQUEST: ${{ inputs.request }}
          WORKER_RECEIPT: ${{ inputs.receipt_key }}
        run: python3 controller/scripts/ci_cutover/buildonly_designer_ingress.py
  windows:
    needs: admit
    uses: jsdfhasuh/python_build_scripts/.github/workflows/windows-package-mainline-v2.yml@06dc601dc2f4a0e146ed90978b4629d3bb371523
    permissions:
      contents: read
    with:
      product_sha: ${{ needs.admit.outputs.execution_sha }}
      designer_only: true
      recipient: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
