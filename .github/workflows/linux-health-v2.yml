name: Linux startup error V2 targeted (not acceptance)
on:
  push:
    branches: [dot/mainline-ci-migration-20261124]
    paths: [".github/diagnostic-activation/linux-health-v2.json"]
permissions:
  contents: read
jobs:
  source:
    if: >-
      github.repository_id == '1468905732' &&
      github.ref == 'refs/heads/dot/mainline-ci-migration-20261124' &&
      github.event_name == 'push'
    name: Linux startup error reproduction / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      SOURCE_PLATFORM: linux
      SOURCE_SHARD: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: 20e37d67ea55fd71760dfc9c19b4891fc447174c
          path: product
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Verify V2 configuration and install fixed age
        id: prepare
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve()
          subprocess.run([sys.executable, "controller/scripts/seal_linux_health_v2.py", "--preflight"], check=True)
          subprocess.run([sys.executable, "controller/scripts/install_web_age.py", str(scratch / "source-age")], check=True)
      - name: Run the one original Linux test with bounded evidence
        id: workload
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve()
          sys.exit(subprocess.run([sys.executable, "controller/scripts/run_linux_health_v2.py", "product",
                   str(scratch / "source-raw"), os.environ["SOURCE_PLATFORM"], os.environ["SOURCE_SHARD"]]).returncode)
      - name: Seal V2 ciphertext only
        id: seal
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.workload.outcome != 'skipped' }}
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
          SOURCE_OUTCOME: ${{ steps.workload.outcome }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve()
          binary = scratch / "source-age" / ("age.exe" if os.name == "nt" else "age")
          sys.exit(subprocess.run([sys.executable, "controller/scripts/seal_linux_health_v2.py", "product",
                   str(scratch / "source-raw"), str(scratch / "source-evidence.tar.age"), str(binary)]).returncode)
      - name: Retain source ciphertext only
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-health-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence.tar.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
