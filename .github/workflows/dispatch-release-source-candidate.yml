name: Event-bound Windows release source (dark pilot)
on:
  workflow_dispatch:
    inputs:
      request:
        required: true
        type: string
permissions:
  contents: read
jobs:
  admit:
    if: >-
      github.repository_id == '1468905732' &&
      vars.EMO_CI_WINDOWS_DARK_PILOT == 'true' &&
      startsWith(github.ref, 'refs/tags/ci-worker-') &&
      github.workflow_sha == vars.EMO_CI_CANDIDATE_WORKER_SHA &&
      github.actor_id == vars.EMO_CI_CANDIDATE_BROKER_ACTOR_ID &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execution_sha: ${{ steps.verify.outputs.execution_sha }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Verify trusted source event and exact commit
        id: verify
        env:
          WORKER_ROUTE: release-source
          WORKER_REQUEST: ${{ inputs.request }}
        run: python3 controller/scripts/ci_cutover/windows_ingress.py
  validate:
    needs: admit
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      EXPECTED_PRODUCT_SHA: ${{ needs.admit.outputs.execution_sha }}
      RELEASE_TAG: ${{ needs.admit.outputs.release_tag }}
      QT_QPA_PLATFORM: windows
    steps:
      - name: Enforce approved V2 recipient before checkout
        id: v2_gate
        shell: pwsh
        env:
          AGE_RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          if ($env:EXPECTED_PRODUCT_SHA -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Expected immutable product commit' }
          if ($env:AGE_RECIPIENT -cnotmatch '\Aage1[0-9a-z]{58}\z') { throw 'Invalid V2 recipient' }
          $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($env:AGE_RECIPIENT))).ToLowerInvariant()
          if ($digest -cne 'ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87') { throw 'V2 recipient mismatch' }
      - name: Prepare trusted age before package phases
        id: age_ready
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'age-v1.2.1.zip'
          curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 -o $zip https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-windows-amd64.zip
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '46db0db71f146061f7c8fffa912cb806aef1bc8450e27a3abc1744f0591b89fb') { throw 'age binary verification failed' }
          $tool = Join-Path $env:RUNNER_TEMP 'emo-age'
          Expand-Archive $zip $tool
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Original release validation without publication
        id: release_source
        working-directory: source
        timeout-minutes: 90
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $env:RUNNER_TEMP 'release-source.log'
          try {
            & {
              if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_PRODUCT_SHA) { throw 'checkout mismatch' }
              python -m pip install -r requirements-dev.txt
              Set-DisplayResolution -Width 1920 -Height 1080 -Force
              $env:PYTHONPATH = (Resolve-Path -LiteralPath 'src').Path
              @'
          import json
          import emo_master
          from PySide2.QtWidgets import QApplication
          app = QApplication([])
          screen = app.primaryScreen()
          geometry = screen.geometry()
          print(json.dumps({"platform": app.platformName(),
              "geometry": geometry.getRect(),
              "available": screen.availableGeometry().getRect(),
              "scale": screen.devicePixelRatio()}), flush=True)
          assert app.platformName() == "windows"
          assert geometry.width() >= 1920 and geometry.height() >= 1080
          '@ | python -
              if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,3}([-.][A-Za-z0-9._-]+)?$') { throw 'Invalid approved release version' }
              $appVersion = python -c "import emo_master; print(emo_master.__version__)"
              if ($env:RELEASE_TAG.Substring(1) -cne $appVersion.Trim()) { throw 'Release version mismatch' }
              Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
              python scripts/ci_check.py
            } *> $log
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $log
            throw 'Release-source checks failed; see V2 evidence'
          }
      - name: Seal fixed evidence files
        if: ${{ always() && steps.v2_gate.outcome == 'success' && steps.age_ready.outcome == 'success' }}
        id: seal
        env:
          AGE_RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
          SOURCE_OUTCOME: ${{ steps.release_source.outcome }}
        shell: python
        run: |
          import hashlib, io, json, os, stat, subprocess, tarfile
          from pathlib import Path
          env = os.environ
          root = Path(env["RUNNER_TEMP"]).resolve()
          source = Path(env["GITHUB_WORKSPACE"]).absolute() / "source"
          out = root / "release-source.tar.age"
          mib = 2**20
          def read(path, cap):
              try:
                  st = path.lstat()
              except FileNotFoundError:
                  return None
              if not stat.S_ISREG(st.st_mode) or st.st_nlink != 1 or st.st_size > cap:
                  raise ValueError
              for part in (path, *path.parents):
                  if getattr(part.lstat(), "st_file_attributes", 0) & 0x400:
                      raise ValueError
              with path.open("rb") as stream:
                  if not os.path.samestat(st, os.fstat(stream.fileno())):
                      raise ValueError
                  blob = stream.read(cap+1)
              if len(blob) != st.st_size:
                  raise ValueError
              return blob
          try:
              recipient=env["AGE_RECIPIENT"]
              if hashlib.sha256(recipient.encode("ascii")).hexdigest() != "ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87":
                  raise ValueError
              status = {"product_sha":env["EXPECTED_PRODUCT_SHA"],"release_tag":env["RELEASE_TAG"],
                        "controller_sha":env["GITHUB_WORKFLOW_SHA"],"run_id":env["GITHUB_RUN_ID"],
                        "attempt":env["GITHUB_RUN_ATTEMPT"],"publication_requested":False,
                        "source_checks_outcome":env["SOURCE_OUTCOME"]}
              candidates = {root/"release-source.log":32*mib,source/"build"/"ci-results.xml":24*mib,
                            source/"build"/"ci-failures.log":12*mib}
              files = {p.name:payload for p,cap in candidates.items()
                       if (payload:=read(p,cap)) is not None}
              if status["source_checks_outcome"]=="success" and not {"release-source.log","ci-results.xml"}<=files.keys():
                  raise ValueError
              files["identity.json"] = json.dumps(status,sort_keys=True).encode("ascii")
              files["manifest.json"] = json.dumps({name:{"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
                     for name,data in files.items()},sort_keys=True).encode("ascii")
              age = root/"emo-age"/"age"/"age.exe"
              with subprocess.Popen([str(age),"-r",recipient,"-o",str(out)],
                                    stdin=subprocess.PIPE,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL) as proc:
                  with proc.stdin as pipe, tarfile.open(fileobj=pipe,mode="w|") as bundle:
                      for name,data in sorted(files.items()):
                          item = tarfile.TarInfo(name)
                          item.size, item.mode = len(data), 0o600
                          bundle.addfile(item,io.BytesIO(data))
                  if proc.wait(timeout=60)!=0: raise ValueError
              with out.open("rb") as fh:
                  if fh.readline(64)!=b"age-encryption.org/v1\n": raise ValueError
          except Exception:
              out.unlink(missing_ok=True)
              raise SystemExit("release_source_evidence=seal_failed") from None
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.seal.outcome == 'success' }}
        with:
          name: windows-release-source-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-source.tar.age
          if-no-files-found: error
          retention-days: 7
