name: Public credit workload proof (not route acceptance)
on:
  push:
    branches: [dot/public-credit-workload-proof-20261124]

permissions:
  contents: read

jobs:
  windows:
    if: github.repository_id == '1468905732' && github.ref == 'refs/heads/dot/public-credit-workload-proof-20261124'
    name: ${{ matrix.suite }} / Windows Python 3.10
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: runtime-credit-diagnostics, timeout: 20}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: 5ade74707331f1f95df81615a7cfec43a7afccfd
          path: product
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install pinned age before credit workload
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          subprocess.run([sys.executable, "controller/scripts/install_age.py", str(root / "_emo_age_tool")], check=True)
      - name: Run fixed diagnostics and stage bounded evidence for encryption
        id: workload
        env:
          EMO_DIAGNOSTIC: ${{ matrix.suite }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import stat
          import xml.etree.ElementTree as ET

          STAGES = {
              "runtime-credit-diagnostics": ("setup", "resource_probe", "credit_control", "evidence_validation"),
          }
          ENUMS = ("success", "failure", "skipped")

          def summary(suite, status_file, process_code):
              try:
                  with status_file.open("rb") as stream:
                      payload = stream.read(8193)
                  if len(payload) > 8192:
                      raise ValueError
                  data = json.loads(payload)
                  stages = STAGES[suite]
                  status, rows = data["status"], data["steps"]
                  if status not in ENUMS or type(rows) is not list:
                      raise ValueError
                  if status == "skipped" and not rows and process_code == 0 and suite == "runtime-credit-diagnostics":
                      return ("diagnostic_worker=skipped",), False
                  if len(stages) != len(rows):
                      raise ValueError
                  outcomes = []
                  for ordinal, (row, stage) in enumerate(zip(rows, stages), 3):
                      outcome = row["status"]
                      if row["ordinal"] != ordinal or outcome not in ENUMS:
                          raise ValueError
                      outcomes.append(outcome)
                  successful = process_code == 0 and status == "success" and "failure" not in outcomes
                  failed = process_code == 1 and status == "failure" and "failure" in outcomes
                  if not (successful or failed):
                      raise ValueError
                  lines = tuple(stage + "=" + ENUMS[ENUMS.index(outcome)] for stage, outcome in zip(stages, outcomes))
                  return (*lines, "diagnostic_worker=" + ("success" if successful else "failure")), successful
              except (OSError, ValueError, TypeError, KeyError, AttributeError, IndexError):
                  return ("diagnostic_worker=report_unavailable",), False

          product = Path("product").resolve()
          evidence = Path(os.environ["RUNNER_TEMP"]) / "emo-diagnostics-private"
          # Exercise the workload directly, not the historical product-route gate.
          # Never supply or claim the retired product branch as an event ref.
          proof = """
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys

          assert sys.platform == "win32" and sys.version_info[:2] == (3, 10)
          product, evidence = map(Path, sys.argv[1:3])
          digest, run_id, run_attempt = sys.argv[3:]
          assert digest == "5ade74707331f1f95df81615a7cfec43a7afccfd"
          assert all(re.fullmatch(r"[0-9]{1,24}", value) for value in (run_id, run_attempt))
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=product, text=True).strip() == digest
          sys.path.insert(0, str(product / "scripts/ci_migration/diagnostics"))
          from run import RECIPES, ARCH_REF, execute
          original = RECIPES["runtime-credit-diagnostics"]
          assert original["job_if"] == f"github.ref == '{ARCH_REF}'"
          assert original["timeout_minutes"] == 20 and original["env"]["QT_QPA_PLATFORM"] == "windows"
          evidence.mkdir()
          # Preserve original steps; only select encrypted file transport.
          steps = [dict(step) for step in original["steps"]]
          needle = '--output-json "$env:RUNNER_TEMP/export-credit-public.json"'
          report_step, = (step for step in steps if needle in step["run"])
          report_step["run"] = report_step["run"].replace(needle, needle + " --local-file-only", 1)
          outcome = execute({**original, "job_if": None, "steps": steps}, "", product, evidence, digest, run_id, run_attempt)
          (evidence / "status.json").write_text(json.dumps(outcome), encoding="utf-8")
          sys.exit(outcome["status"] != "success")
          """
          import textwrap
          try:
              result = subprocess.run([sys.executable, "-c", textwrap.dedent(proof), str(product), str(evidence),
                                       "5ade74707331f1f95df81615a7cfec43a7afccfd",
                                       os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]],
                                      stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              process_code = result.returncode
          except OSError:
              process_code = 2
          suite = os.environ["EMO_DIAGNOSTIC"]
          lines, ok = summary(suite, evidence / "status.json", process_code)

          # This directory is consumed by the separate encryption step. Never
          # upload the original evidence or unchecked files from the product.
          staging = Path(os.environ["RUNNER_TEMP"]) / "_emo_evidence" / "diagnostics"
          staging.mkdir(parents=True, exist_ok=False)
          report = {key: value for key, value in (line.split("=", 1) for line in lines)}
          evidence_ok = True
          mib = 1024 * 1024

          def copy_bounded(source, name, cap, *, required=False, log=False):
              try:
                  initial = source.lstat()
                  if not stat.S_ISREG(initial.st_mode) or initial.st_nlink != 1 or getattr(initial, "st_file_attributes", 0) & 0x400:
                      return False
                  with source.open("rb") as stream:
                      current = os.fstat(stream.fileno())
                      if not os.path.samestat(initial, current):
                          return False
                      length = current.st_size
                      if not log and not 0 < length <= cap:
                          return False
                      marker = b"[leading bytes omitted]\n"
                      offset = max(0, length - cap + len(marker)) if log and length > cap else 0
                      stream.seek(offset)
                      data = stream.read(cap + 1)
                      if len(data) != length - offset:
                          return False
                  if offset:
                      data = marker + data
                  elif not log and name.endswith(".json"):
                      if not isinstance(json.loads(data), dict):
                          return False
                  elif not log and name.endswith(".xml"):
                      if ET.fromstring(data).tag not in {"testsuite", "testsuites"}:
                          return False
                  (staging / name).write_bytes(data)
                  return True
              except FileNotFoundError:
                  return not required
              except (OSError, ValueError, ET.ParseError):
                  return False

          for ordinal, stage in enumerate(STAGES[suite], 3):
              name = f"step-{ordinal:02d}.log"
              evidence_ok &= copy_bounded(evidence / name, name, 256 * 1024, log=True,
                                          required=report.get(stage) in ("success", "failure") and stage != "evidence_present")

          evidence_ok &= copy_bounded(evidence / "temp" / "export-credit-public.json",
                                      "export-credit-public.json", 8 * mib,
                                      required=report.get("evidence_validation") == "success")

          report["proof_kind"] = "workload_only_not_route_acceptance"
          report["evidence_capture"] = "success" if evidence_ok else "failure"
          (staging / "stage-report.json").write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          print("evidence_capture=" + report["evidence_capture"])
          ok = ok and evidence_ok
          print(*lines, sep="\n")
          sys.exit(not ok)
      - name: Encrypt retained evidence even when the workload fails
        id: seal
        if: ${{ always() }}
        shell: python
        env:
          CI_EVIDENCE_RECIPIENT: 'age175t0tm4e6908h3wjazctf3893gvfqc5p07sez9tsm85h9ndjpvrsx5pzw4'
          EMO_EVIDENCE_SOURCE: '5ade74707331f1f95df81615a7cfec43a7afccfd'
          EMO_EVIDENCE_PACKAGER: ''
          EMO_EVIDENCE_JOB: '${{ matrix.suite }}'
          EMO_EVIDENCE_OUTCOME: ${{ steps.workload.outcome || 'skipped' }}
        run: |
          import os
          import platform
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          tools = root / "_emo_age_tool"
          worker = Path("controller/scripts")
          exe = tools / ("age.exe" if platform.system() == "Windows" else "age")
          target = root / "_emo_ciphertext" / "evidence.tar.age"
          subprocess.run([sys.executable, str(worker / "ci_evidence.py"), "diagnostics",
                          str(root / "_emo_evidence" / "diagnostics"), str(target), str(exe)], check=True)
      - name: Upload ciphertext only
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-diagnostics-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/_emo_ciphertext/evidence.tar.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
