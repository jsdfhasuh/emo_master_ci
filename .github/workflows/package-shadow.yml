name: Public product Windows build-only shadow
on:
  push:
    branches: [dot/public-package-shadow-20261123]

permissions:
  contents: read

jobs:
  build-only:
    if: github.repository_id == '1468905732' && github.ref == 'refs/heads/dot/public-package-shadow-20261123'
    name: ${{ matrix.target }} build and validate
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [emo-master, emo-master-runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: cc68df54803489356fabd158293c99c0c1e2ef85
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/python_build_scripts
          ref: 91766f6d18ca9a333f64cf1c6030202457ec4a8a
          path: packager
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install required Python packages quietly
        shell: python
        run: |
          import subprocess
          import sys
          p = subprocess.run([sys.executable, "-m", "pip", "install", "-r", "product/requirements-dev.txt",
                              "pyinstaller==6.22.2", "psutil", "pywinauto", "Pillow"],
                             stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          print("build_dependencies=" + ("success" if p.returncode == 0 else "failure"))
          sys.exit(p.returncode != 0)
      - name: Install and verify pinned Inno Setup
        shell: pwsh
        run: |
          try {
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup-6_7_3'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
            $sig = Get-AuthenticodeSignature -LiteralPath $installer
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'signature' }
            $p = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir") -WindowStyle Hidden -Wait -PassThru
            $iscc = Join-Path $dir 'ISCC.exe'
            if ($p.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'installer' }
            Add-Content -LiteralPath $env:GITHUB_ENV "ISCC_PATH=$iscc"
            Write-Output 'inno_setup=success'
          } catch {
            Write-Output 'inno_setup=failure'
            exit 1
          }
      - name: Build and validate without submitting a release
        env:
          BUILD_TARGET: ${{ matrix.target }}
          HUARAY_CAMERA_SMOKE: '0'
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          source = Path("product").resolve()
          packager = Path("packager").resolve()
          release = ast.parse((source / "src/emo_master/app_version.py").read_text(encoding="utf-8"))
          version, = (ast.literal_eval(node.value) for node in release.body if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == "APP_VERSION" for target in node.targets))
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}", version):
              sys.exit(1)
          private = Path(os.environ["RUNNER_TEMP"])
          safe_env = {k: v for k, v in os.environ.items() if not k.startswith(("GITHUB_", "ACTIONS_", "RUNNER_"))
                      and k not in {"GH_TOKEN", "EMO_CI_TOKEN", "SOURCE_REPO_TOKEN", "RELEASE_REPO_TOKEN"}}
          args = ["pwsh", "-NoProfile", "-NonInteractive", "-File",
                  str(source / "scripts/ci_migration/windows/windows-build-validate.ps1"),
                  "-Target", os.environ["BUILD_TARGET"], "-SourceRoot", str(source), "-PackagerRoot", str(packager),
                  "-SourceSha", "cc68df54803489356fabd158293c99c0c1e2ef85", "-ReleaseTag", "v" + version,
                  "-OutputDirectory", str(private / "product-build-verification")]
          with (private / "product-build.log").open("xb") as log:
              result = subprocess.run(args, env=safe_env, stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
          print("build_and_validate=" + ("success" if result.returncode == 0 else "failure"))
          sys.exit(result.returncode != 0)
