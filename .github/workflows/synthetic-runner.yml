name: Synthetic runner smoke
on:
  push:
    branches: [dot/synthetic-runner-smoke-20261123]
  workflow_dispatch:
    inputs:
      exercise_failure:
        description: "Verify that a synthetic failure stays red"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} / Python 3.10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Verify Python version
        run: python -c "import sys; assert sys.version_info[:2] == (3, 10); print(sys.version.split()[0])"
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Exercise synthetic failure
        if: inputs.exercise_failure == true
        run: python -c "raise SystemExit(1)"
