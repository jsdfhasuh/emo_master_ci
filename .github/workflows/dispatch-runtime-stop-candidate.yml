name: Windows STOP diagnostics V2 (not acceptance) (event-bound)
run-name: emo-ci-candidate-${{ inputs.receipt_key }}
on:
  workflow_dispatch:
    inputs:
      receipt_key:
        description: Opaque exact broker request SHA-256 (not credentials)
        required: true
        type: string
      request:
        required: true
        type: string
permissions:
  contents: read
jobs:
  admit:
    if: >-
      github.repository_id == '1468905732' &&
      startsWith(github.ref, 'refs/tags/ci-worker-') &&
      github.workflow_sha == vars.EMO_CI_CANDIDATE_WORKER_SHA &&
      github.actor_id == vars.EMO_CI_CANDIDATE_BROKER_ACTOR_ID &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execution_sha: ${{ steps.verify.outputs.execution_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify diagnostic receipt and exact live SHA
        id: verify
        env:
          WORKER_ROUTE: stop
          WORKER_CONTROLLER_SHA: ${{ github.workflow_sha }}
          WORKER_REQUEST: ${{ inputs.request }}
        run: python3 scripts/ci_cutover/verify_web_display_ingress.py
  control:
    needs: admit
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: product
    env:
      SOURCE_SHA: ${{ needs.admit.outputs.execution_sha }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: product
          repository: jsdfhasuh/emo_master
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact diagnostic source checkout
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -cne $env:SOURCE_SHA) { throw "diagnostic_source_pin_mismatch" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
      - id: bootstrap
        name: Install digest-pinned Windows age and validate V2 recipient
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          import hashlib, io, os, re, zipfile
          from pathlib import Path
          from urllib.request import urlopen
          recipient = os.environ["RECIPIENT"]
          if not re.fullmatch(r"age1[023456789ac-hj-np-z]{58}", recipient) or hashlib.sha256(recipient.encode("ascii")).hexdigest() != "ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87":
              raise SystemExit("stop_v2=recipient_mismatch")
          try:
              with urlopen("https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-windows-amd64.zip", timeout=50) as response:
                  data = response.read(12 * 1024 * 1024 + 1)
              if hashlib.sha256(data).hexdigest() != "46db0db71f146061f7c8fffa912cb806aef1bc8450e27a3abc1744f0591b89fb":
                  raise ValueError
              with zipfile.ZipFile(io.BytesIO(data)) as bundle:
                  (Path(os.environ["RUNNER_TEMP"]) / "stop-age.exe").write_bytes(bundle.read("age/age.exe"))
          except Exception:
              raise SystemExit("stop_v2=tool_install_failed") from None
      - name: Run fixed original full suite and distinct post-checks
        shell: pwsh
        env:
          GITHUB_WORKFLOW_SHA_FIXED: ${{ github.workflow_sha }}
        run: |
          python -I ../controller/scripts/runtime_stop_recipe.py .
          exit $LASTEXITCODE
      - id: seal
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        name: Seal evidence without displaying product output
        shell: pwsh
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          python -I ../controller/scripts/runtime_stop_seal.py
          exit $LASTEXITCODE
      - name: Keep only V2 ciphertext
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stop-v2-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stop-evidence.tar.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
