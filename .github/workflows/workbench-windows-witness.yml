name: Windows workbench pagination witness
on:
  push:
    branches: [dot/windows-workbench-witness-20261124]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository_id == '1468905732'
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        target: [single]
    env:
      QT_QPA_PLATFORM: offscreen
      EMO_EVIDENCE_SOURCE: '4949290ad73515bae8c388f9760412c84d295094'
      EMO_EVIDENCE_PACKAGER: ''
      EMO_EVIDENCE_JOB: 'workbench-${{ matrix.target }}'
      CI_EVIDENCE_RECIPIENT: 'age175t0tm4e6908h3wjazctf3893gvfqc5p07sez9tsm85h9ndjpvrsx5pzw4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: ${{ env.EMO_EVIDENCE_SOURCE }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install verified age before pytest
        id: age
        shell: pwsh
        run: python controller/scripts/install_age.py "$env:RUNNER_TEMP/_emo_age_tool"
      - name: Run unmodified workbench assertions under native Windows with Qt offscreen
        id: workload
        shell: python
        env:
          PROBE_TARGET: ${{ matrix.target }}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ["RUNNER_TEMP"])
          staging = root / "_emo_workbench_evidence"
          staging.mkdir()
          product = Path("product").resolve()
          path = "tests/designer/test_runtime_job_workbench.py"
          node = path + "::testNativeWhileLogsWarningDeviceReturnAndTimeline"
          capture = "tests/runtime/presentation/test_normal_capture.py::testOriginalStartCapturesInstalledOperatorsAndProductionCounter"
          targets = {"single": [node, capture], "module": [path, capture]}
          target = targets[os.environ["PROBE_TARGET"]]
          result = "failure"
          phase = "identity"
          try:
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=product, stderr=subprocess.DEVNULL, text=True).strip()
              if sha != os.environ["EMO_EVIDENCE_SOURCE"] or sys.version_info[:2] != (3,10):
                  raise ValueError
              phase = "setup"
              with (staging / "step-03.log").open("wb") as log:
                  subprocess.run([sys.executable, "-m", "pip", "install", "-r", "requirements-dev.txt"],
                                 cwd=product, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=480)
              phase = "pytest"
              with (staging / "step-05.log").open("wb") as log:
                  rc = subprocess.run([sys.executable, "-m", "pytest", "-v", "--tb=long", "-o", "faulthandler_timeout=90",
                                       "-p", "scripts.ci_migration.diagnostics.pytest_evidence",
                                       f"--emo-pytest-evidence-dir={staging}",
                                       "-p", "scripts.r3_sqlite_capture_diagnostics", "--sqlite-capture-diagnostics",
                                       str(root / "workbench-observer.json"), "--junitxml", str(staging / "observed-junit.xml"), *target],
                                      cwd=product, stdout=log, stderr=subprocess.STDOUT, timeout=300).returncode
              result = "success" if rc == 0 else "failure"
          except subprocess.TimeoutExpired:
              result = "timeout"
          except (OSError, ValueError, subprocess.CalledProcessError):
              pass
          finally:
              (staging / "stage-report.json").write_text(json.dumps({"outcome": result, "phase": phase}) + "\n", encoding="utf-8")
          print("workbench_" + phase + "=" + result)
          sys.exit(result != "success")
      - name: Encrypt assertion and JUnit evidence
        id: seal
        if: ${{ always() && steps.age.outcome == 'success' && steps.workload.outcome != 'skipped' }}
        shell: pwsh
        env:
          EMO_EVIDENCE_OUTCOME: ${{ steps.workload.outcome }}
        run: |
          python controller/scripts/ci_evidence.py diagnostics "$env:RUNNER_TEMP/_emo_workbench_evidence" "$env:RUNNER_TEMP/_emo_workbench_cipher/evidence.tar.age" "$env:RUNNER_TEMP/_emo_age_tool/age.exe"
      - name: Upload ciphertext only
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-diagnostics-workbench-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/_emo_workbench_cipher/evidence.tar.age
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
