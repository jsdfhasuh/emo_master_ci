name: Windows normal capture diagnostics (not acceptance)

on:
  push:
    branches: [dot/mainline-ci-migration-20261124]
    paths: [".github/diagnostic-activation/capture-v2.json"]

permissions:
  contents: read

concurrency:
  group: windows-capture-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository_id == '1468905732'
    name: Instrumented original order / Windows / Python 3.10
    # Standard CI machine class and dependencies; original test order,
    # deadlines, worker target, SQLite durability and assertions stay intact.
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: 5b08d7455b665ba1ac83f46890c83194bc92014f
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
      - name: Verify V2 recipient and install pinned Windows age
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          import hashlib, io, os, re, zipfile
          from pathlib import Path
          from urllib.request import urlopen
          recipient = os.environ["RECIPIENT"]
          if not re.fullmatch(r"age1[023456789ac-hj-np-z]{58}", recipient) or hashlib.sha256(recipient.encode("ascii")).hexdigest() != "ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87":
              raise SystemExit("capture_v2=recipient_mismatch")
          url = "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-windows-amd64.zip"
          with urlopen(url, timeout=50) as download:
              data = download.read(12 * 1024 * 1024 + 1)
          if hashlib.sha256(data).hexdigest() != "46db0db71f146061f7c8fffa912cb806aef1bc8450e27a3abc1744f0591b89fb":
              raise SystemExit("capture_v2=tool_digest_mismatch")
          with zipfile.ZipFile(io.BytesIO(data)) as bundle:
              with (Path(os.environ["RUNNER_TEMP"]) / "capture-age.exe").open("xb") as binary:
                  binary.write(bundle.read("age/age.exe"))
      - name: Install the existing test dependencies
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          with (Path(os.environ["RUNNER_TEMP"]) / "capture-dependencies.log").open("xb") as log:
              result = subprocess.run([sys.executable, "-m", "pip", "install", "-r", "requirements-dev.txt"],
                                      stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
          if result.returncode:
              raise SystemExit("capture_v2=dependency_install_failed")
      - name: Record the hosted runner resource boundary
        shell: python
        run: |
          import ctypes, json, os
          from ctypes import wintypes
          class Memory(ctypes.Structure):
              _fields_ = [("length", wintypes.DWORD), ("load", wintypes.DWORD)] + [
                  (name, ctypes.c_ulonglong) for name in (
                      "total_physical", "available_physical", "total_commit",
                      "available_commit", "total_virtual", "available_virtual", "extended_virtual")]
          kernel = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel.GlobalMemoryStatusEx.argtypes = [ctypes.POINTER(Memory)]
          kernel.GlobalMemoryStatusEx.restype = wintypes.BOOL
          memory = Memory()
          memory.length = ctypes.sizeof(memory)
          if not kernel.GlobalMemoryStatusEx(ctypes.byref(memory)):
              raise ctypes.WinError(ctypes.get_last_error())
          print(json.dumps({"role": "diagnostic_only", "runner": "windows-latest standard",
              "job_timeout_minutes": 120, "cpu_count": os.cpu_count(),
              **{name: getattr(memory, name) for name in (
                  "total_physical", "available_physical", "total_commit", "available_commit")}}))
      - name: Seal preflight checkpoint using V2
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          from subprocess import DEVNULL
          root = Path(os.environ["RUNNER_TEMP"])
          recipient = os.environ["RECIPIENT"]
          if hashlib.sha256(recipient.encode("ascii")).hexdigest() != "ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87":
              raise SystemExit("capture_v2=recipient_mismatch")
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], stderr=DEVNULL, text=True).strip()
          if revision != "5b08d7455b665ba1ac83f46890c83194bc92014f":
              raise SystemExit("capture_v2=pin_mismatch")
          record = {"role": "diagnostic_only", "source_sha": revision,
                    "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"], "run": os.environ["GITHUB_RUN_ID"],
                    "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "observed_tests": "not_run"}
          subprocess.run([str(root / "capture-age.exe"), "-r", recipient,
                          "-o", str(root / "capture-preflight.age")], input=json.dumps(record).encode("ascii"),
                         stdout=DEVNULL, stderr=DEVNULL, check=True, timeout=90)
      - name: Upload V2 preflight ciphertext only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-v2-capture-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-preflight.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Run original pytest suite with private bounded observations
        id: observed_tests
        timeout-minutes: 82
        shell: python
        run: |
          import os, subprocess, sys, threading
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plugin = root / "capture_phase_evidence.py"
          plugin.write_text(
              'import json, os\n'
              'from pathlib import Path\n'
              '_journal = Path(os.environ["RUNNER_TEMP"]).joinpath("pytest-phases.jsonl").open("xb", buffering=0)\n'
              '_remaining = 24 * 1024 * 1024\n'
              'def _emit(event, **values):\n'
              '    global _remaining\n'
              '    line = (json.dumps(dict(event=event, **values), ensure_ascii=True) + "\\n").encode("ascii")\n'
              '    if len(line) <= _remaining:\n'
              '        _journal.write(line)\n'
              '        _remaining -= len(line)\n'
              'def pytest_collection_finish(session):\n'
              '    _emit("collection_finish", collected=session.testscollected or len(session.items))\n'
              'def pytest_runtest_logreport(report):\n'
              '    _emit("phase_end", nodeid=report.nodeid[:512], phase=report.when, outcome=report.outcome, seconds=report.duration)\n'
              'def pytest_sessionfinish(session, exitstatus):\n'
              '    _emit("session_finish", exitstatus=int(exitstatus))\n',
              encoding="utf-8")
          env = dict(os.environ)
          env["PYTHONPATH"] = str(root) + (os.pathsep + env["PYTHONPATH"] if env.get("PYTHONPATH") else "")
          command = [sys.executable, "-m", "pytest", "-q",
                     "-p", "scripts.r3_sqlite_capture_diagnostics", "--sqlite-capture-diagnostics",
                     str(root / "runtime-capture-diagnostics.json"),
                     "-o", "faulthandler_timeout=90", "-p", "capture_phase_evidence", "--junitxml", str(root / "observed-junit.xml")]
          worker = subprocess.Popen(command, env=env, stdin=subprocess.DEVNULL,
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          def drain():
              remaining = 4 * 1024 * 1024
              with (root / "observed-output.log").open("xb", buffering=0) as log:
                  while chunk := worker.stdout.read1(65536):
                      kept = chunk[:remaining]
                      log.write(kept)
                      remaining -= len(kept)
          reader = threading.Thread(target=drain, daemon=True)
          reader.start()
          try:
              status = worker.wait(timeout=80 * 60)
          except subprocess.TimeoutExpired:
              subprocess.run(["taskkill", "/PID", str(worker.pid), "/T", "/F"],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)
              (root / "capture-timed-out").touch()
              status = 124
          reader.join(timeout=15)
          if reader.is_alive():
              print("capture_v2=output_drain_unfinished")
              sys.exit(1)
          print("capture_v2=workload_finished")
          sys.exit(status)
      - name: Validate bounded synthetic evidence without printing it
        id: validate
        if: ${{ !cancelled() }}
        shell: python
        env:
          ORIGINAL_TEST_STEP: ${{ steps.observed_tests.outcome }}
        run: |
          import json, os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "runtime-capture-diagnostics.json"
          if not evidence.is_file() or not 0 < evidence.stat().st_size <= 1024 * 1024:
              raise RuntimeError("CAPTURE_DIAGNOSTIC_UNAVAILABLE: missing, empty or oversized; do not infer PASS")
          content = evidence.read_text(encoding="utf-8")
          record = json.loads(content)
          source = record.get("source", {})
          target = "tests/runtime/presentation/test_normal_capture.py::testOriginalStartCapturesInstalledOperatorsAndProductionCounter"
          valid = (source.get("test") == target
              and source.get("diagnostic_valid") is True
              and source.get("source_stable") is True
              and source.get("runtime_bound") is True
              and source.get("fixture_teardown_outcome") in ("passed", "failed")
              and record.get("observer_retired") is True
              and record.get("worker_instrumented") is False
              and record.get("errors") == []
              and source.get("pytest_outcome") in ("passed", "failed"))
          if os.environ.get("ORIGINAL_TEST_STEP") == "success":
              valid = (valid and source.get("pytest_outcome") == "passed"
                  and source.get("fixture_teardown_outcome") == "passed")
          if not valid:
              raise RuntimeError("CAPTURE_DIAGNOSTIC_INVALID: missing, changed or unfinished observations")
      - name: Seal bounded Capture evidence using only V2
        id: seal
        if: ${{ !cancelled() && steps.observed_tests.outcome != 'skipped' }}
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
          OBSERVED: ${{ steps.observed_tests.outcome }}
          VALIDATED: ${{ steps.validate.outcome }}
        run: |
          import hashlib, io, json, os, re, stat, subprocess, tarfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          recipient = os.environ["RECIPIENT"]
          if not re.fullmatch(r"age1[023456789ac-hj-np-z]{58}", recipient) or hashlib.sha256(recipient.encode("ascii")).hexdigest() != "ba311eeae31312c73f57c9a2cc4c80bbb58380e7c3df956db1d09432b79cca87":
              raise SystemExit("capture_v2=recipient_mismatch")
          name = "runtime-capture-diagnostics.json"
          caps = {name: 1024 * 1024, "observed-output.log": 4 * 1024 * 1024,
                  "pytest-phases.jsonl": 24 * 1024 * 1024, "observed-junit.xml": 12 * 1024 * 1024}
          files = {}
          for item, cap in caps.items():
              source = root / item
              try:
                  initial = source.lstat()
                  if stat.S_ISREG(initial.st_mode) and initial.st_nlink == 1 and not getattr(initial, "st_file_attributes", 0) & 0x400:
                      with source.open("rb") as stream:
                          current = os.fstat(stream.fileno())
                          if os.path.samestat(initial, current) and 0 < current.st_size <= cap:
                              data = stream.read(cap + 1)
                              if len(data) == current.st_size:
                                  files[item] = data
              except FileNotFoundError:
                  pass
          files["stage-report.json"] = json.dumps({
              "observed_tests": os.environ["OBSERVED"],
              "evidence_validation": os.environ["VALIDATED"],
              "capture_payload": "present" if name in files else "unavailable",
              "observed_tests_budget": "expired" if (root / "capture-timed-out").is_file() else "not_reported_expired",
          }, sort_keys=True).encode("ascii")
          meta = {
              "version": 1, "encryption_profile": "V2", "suite_family": "diagnostics",
              "source_sha": "5b08d7455b665ba1ac83f46890c83194bc92014f",
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "job": "runtime-capture-diagnostics", "outcome": os.environ["OBSERVED"],
              "packager_sha": "",
              "files": {key: {"size": len(value), "sha256": hashlib.sha256(value).hexdigest()} for key, value in files.items()}
          }
          files["manifest.json"] = json.dumps(meta, sort_keys=True).encode("ascii")
          output = root / "capture-evidence.tar.age"
          with subprocess.Popen([str(root / "capture-age.exe"), "-r", recipient, "-o", str(output)],
                                stdin=subprocess.PIPE, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) as cipher:
              with cipher.stdin as sink, tarfile.open(fileobj=sink, mode="w|") as bundle:
                  for key, value in sorted(files.items()):
                      member = tarfile.TarInfo(key)
                      member.size, member.mode = len(value), 0o600
                      bundle.addfile(member, io.BytesIO(value))
              if cipher.wait(timeout=90) != 0:
                  raise SystemExit("capture_v2=seal_failed")
      - name: Upload Capture ciphertext only
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-diagnostics-runtime-capture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-evidence.tar.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
