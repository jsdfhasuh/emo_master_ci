name: Product Source receipt identity proof
run-name: Source event receipt ${{ inputs.dispatcher_run_id }}
on:
  workflow_dispatch:
    inputs:
      dispatcher_run_id:
        required: true
        type: string
      request_artifact_id:
        required: true
        type: string
permissions: {}
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require activated worker and original sender
        env:
          AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && github.repository_id == '1468905732' && github.ref == 'refs/tags/ci-worker-source-event-receipts-20261126' && github.sha == vars.PRODUCT_CI_EVENT_PROOF_WORKER_SHA && github.actor_id == '49879362' && github.run_attempt == '1' }}
        run: test "$AUTHORIZED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - id: bind
        env:
          ORIGIN: ${{ inputs.dispatcher_run_id }}
          ARTIFACT: ${{ inputs.request_artifact_id }}
        run: python -I scripts/source_event_pair.py "$ORIGIN" "$ARTIFACT"
      - name: Verify exact source commit without executing product code
        env:
          EXECUTION: ${{ steps.bind.outputs.execution_sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          git init -q --bare "$RUNNER_TEMP/product-proof.git"
          git -C "$RUNNER_TEMP/product-proof.git" fetch --quiet --no-tags --depth=1 --filter=blob:none https://github.com/jsdfhasuh/emo_master.git "$EXECUTION"
          test "$(git -C "$RUNNER_TEMP/product-proof.git" rev-parse --verify 'FETCH_HEAD^{commit}')" = "$EXECUTION"
          echo "source_event_identity=verified execution_sha=$EXECUTION"
