name: Product PR original Source shards (non-required)
run-name: Source full PR receipt ${{ inputs.dispatcher_run_id }}
on:
  workflow_dispatch:
    inputs:
      dispatcher_run_id:
        required: true
        type: string
      request_artifact_id:
        required: true
        type: string
permissions: {}
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execution_sha: ${{ steps.bind.outputs.execution_sha }}
    permissions:
      contents: read
    steps:
      - name: Require activated worker and original sender
        env:
          AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && github.repository_id == '1468905732' && github.ref == 'refs/tags/ci-worker-source-pr-full-45783106228-v2' && github.sha == vars.PRODUCT_CI_PR_FULL_WORKER_SHA && github.actor_id == '49879362' && github.run_attempt == '1' }}
        run: test "$AUTHORIZED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - id: bind
        env:
          ORIGIN: ${{ inputs.dispatcher_run_id }}
          ARTIFACT: ${{ inputs.request_artifact_id }}
        run: python -I scripts/source_event_pair.py "$ORIGIN" "$ARTIFACT"
  source:
    needs: identity
    permissions:
      contents: read
    name: "${{ matrix.platform }} source (${{ matrix.shard }}) / Python 3.10"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime, other]
        platform: [linux, windows]
        include:
          - {platform: linux, os: ubuntu-latest, job_timeout: 65}
          - {platform: windows, os: windows-latest, job_timeout: 95}
    env:
      EXPECTED_SOURCE_SHA: ${{ needs.identity.outputs.execution_sha }}
      SOURCE_PLATFORM: ${{ matrix.platform }}
      SOURCE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: ${{ needs.identity.outputs.execution_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Verify V2 configuration and install fixed age
        id: prepare
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve()
          source = subprocess.check_output(["git","-C","product","rev-parse","HEAD"], text=True).strip()
          if source != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("source_shadow=checkout_mismatch")
          subprocess.run([sys.executable, "controller/scripts/seal_product_source_v2.py", "--preflight"], check=True)
          subprocess.run([sys.executable, "controller/scripts/install_web_age.py", str(scratch / "source-age")], check=True)
      - name: Run exact original Source shard and retain bounded evidence
        id: workload
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve()
          sys.exit(subprocess.run([sys.executable, "controller/scripts/run_product_source_v2.py", "product",
                   str(scratch / "source-raw"), os.environ["SOURCE_PLATFORM"], os.environ["SOURCE_SHARD"]]).returncode)
      - name: Seal V2 ciphertext only
        id: seal
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.workload.outcome != 'skipped' }}
        shell: python
        env:
          RECIPIENT: ${{ vars.CI_EVIDENCE_RECIPIENT_V2 }}
          SOURCE_OUTCOME: ${{ steps.workload.outcome }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve()
          binary = scratch / "source-age" / ("age.exe" if os.name == "nt" else "age")
          sys.exit(subprocess.run([sys.executable, "controller/scripts/seal_product_source_v2.py", "product",
                   str(scratch / "source-raw"), str(scratch / "source-evidence.tar.age"), str(binary)]).returncode)
      - name: Retain source ciphertext only
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-v2-${{ matrix.platform }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence.tar.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

