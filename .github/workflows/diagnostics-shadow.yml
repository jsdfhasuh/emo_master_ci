name: Public product diagnostics shadow
on:
  push:
    branches: [dot/public-diagnostics-shadow-20261123]

permissions:
  contents: read

jobs:
  windows:
    if: github.repository_id == '1468905732' && github.ref == 'refs/heads/dot/public-diagnostics-shadow-20261123'
    name: ${{ matrix.suite }} / Windows Python 3.10
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: display-session-contract, timeout: 15}
          - {suite: runtime-a18-diagnostics, timeout: 30}
          - {suite: runtime-capture-diagnostics, timeout: 30}
          - {suite: runtime-sqlite-append-controls, timeout: 10}
          - {suite: runtime-sqlite-failure-diagnostics, timeout: 30}
          - {suite: runtime-stop-diagnostics, timeout: 30}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jsdfhasuh/emo_master
          ref: 3cfb1feea46170fe9da2967790924ac3230c1606
          path: product
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Run fixed diagnostics and stage bounded evidence for encryption
        id: workload
        env:
          EMO_DIAGNOSTIC: ${{ matrix.suite }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          STAGES = {
              "display-session-contract": ("setup", "identity", "contract", "evidence_present"),
              "runtime-a18-diagnostics": ("setup", "identity", "observed_tests", "evidence_validation", "wal_control"),
              "runtime-capture-diagnostics": ("setup", "resource_probe", "observed_tests", "evidence_validation"),
              "runtime-credit-diagnostics": ("setup", "resource_probe", "credit_control", "evidence_validation"),
              "runtime-sqlite-append-controls": ("setup", "append_controls", "evidence_validation"),
              "runtime-sqlite-failure-diagnostics": ("setup", "resource_probe", "observed_tests", "evidence_validation", "durable_controls", "controls_validation"),
              "runtime-stop-diagnostics": ("setup", "resource_probe", "observed_tests", "native_evidence", "evidence_validation"),
          }
          ENUMS = ("success", "failure", "skipped")

          def summary(suite, status_file, process_code):
              try:
                  with status_file.open("rb") as stream:
                      payload = stream.read(8193)
                  if len(payload) > 8192:
                      raise ValueError
                  data = json.loads(payload)
                  stages = STAGES[suite]
                  status, rows = data["status"], data["steps"]
                  if status not in ENUMS or type(rows) is not list:
                      raise ValueError
                  if status == "skipped" and not rows and process_code == 0 and suite == "runtime-credit-diagnostics":
                      return ("diagnostic_worker=skipped",), False
                  if len(stages) != len(rows):
                      raise ValueError
                  outcomes = []
                  for ordinal, (row, stage) in enumerate(zip(rows, stages), 3):
                      outcome = row["status"]
                      if row["ordinal"] != ordinal or outcome not in ENUMS:
                          raise ValueError
                      outcomes.append(outcome)
                  successful = process_code == 0 and status == "success" and "failure" not in outcomes
                  failed = process_code == 1 and status == "failure" and "failure" in outcomes
                  if not (successful or failed):
                      raise ValueError
                  lines = tuple(stage + "=" + ENUMS[ENUMS.index(outcome)] for stage, outcome in zip(stages, outcomes))
                  return (*lines, "diagnostic_worker=" + ("success" if successful else "failure")), successful
              except (OSError, ValueError, TypeError, KeyError, AttributeError, IndexError):
                  return ("diagnostic_worker=report_unavailable",), False

          product = Path("product").resolve()
          evidence = Path(os.environ["RUNNER_TEMP"]) / "emo-diagnostics-private"
          try:
              result = subprocess.run([sys.executable, str(product / "scripts/ci_migration/diagnostics/run.py"),
                                       "--suite", os.environ["EMO_DIAGNOSTIC"],
                                       "--product-root", str(product),
                                       "--product-ref", "refs/heads/dot/ci-source-event-context-20261123",
                                       "--source-sha", "3cfb1feea46170fe9da2967790924ac3230c1606",
                                       "--private-evidence-dir", str(evidence),
                                       "--run-id", os.environ["GITHUB_RUN_ID"],
                                       "--run-attempt", os.environ["GITHUB_RUN_ATTEMPT"]],
                                      stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              process_code = result.returncode
          except OSError:
              process_code = 2
          suite = os.environ["EMO_DIAGNOSTIC"]
          lines, ok = summary(suite, evidence / "status.json", process_code)

          # This directory is consumed by the separate encryption step. Never
          # upload the original evidence or unchecked files from the product.
          staging = Path(os.environ["RUNNER_TEMP"]) / "_emo_evidence" / "diagnostics"
          staging.mkdir(parents=True, exist_ok=False)
          report = {key: value for key, value in (line.split("=", 1) for line in lines)}
          (staging / "stage-report.json").write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")

          def copy_bounded(source, dest, cap, *, log=False):
              try:
                  if source.is_symlink() or not source.is_file():
                      return
                  with source.open("rb") as stream:
                      stream.seek(0, os.SEEK_END)
                      length = stream.tell()
                      if not log and length > cap:
                          return
                      omitted = max(0, length - cap)
                      if omitted:
                          stream.seek(omitted, os.SEEK_SET)
                      else:
                          stream.seek(0, os.SEEK_SET)
                      data = stream.read(cap)
                  if omitted:
                      marker = b"[leading bytes omitted]\n"
                      data = marker + data[-(cap - len(marker)):]
                  dest.write_bytes(data)
              except OSError:
                  pass

          for ordinal in range(3, 3 + len(STAGES[suite])):
              name = f"step-{ordinal:02d}.log"
              copy_bounded(evidence / name, staging / name, 256 * 1024, log=True)
          if suite == "display-session-contract":
              copy_bounded(product / "display-evidence" / "junit.xml",
                           staging / "junit.xml", 4 * 1024 * 1024)
          print(*lines, sep="\n")
          sys.exit(not ok)
      - name: Encrypt retained evidence even when the workload fails
        id: seal
        if: ${{ always() }}
        shell: python
        env:
          CI_EVIDENCE_RECIPIENT: 'age175t0tm4e6908h3wjazctf3893gvfqc5p07sez9tsm85h9ndjpvrsx5pzw4'
          EMO_EVIDENCE_SOURCE: '3cfb1feea46170fe9da2967790924ac3230c1606'
          EMO_EVIDENCE_PACKAGER: ''
          EMO_EVIDENCE_JOB: '${{ matrix.suite }}'
          EMO_EVIDENCE_OUTCOME: ${{ steps.workload.outcome || 'skipped' }}
        run: |
          import os
          import platform
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          tools = root / "_emo_age_tool"
          worker = Path("controller/scripts")
          exe = tools / ("age.exe" if platform.system() == "Windows" else "age")
          subprocess.run([sys.executable, str(worker / "install_age.py"), str(tools)], check=True)
          target = root / "_emo_ciphertext" / "evidence.tar.age"
          subprocess.run([sys.executable, str(worker / "ci_evidence.py"), "diagnostics",
                          str(root / "_emo_evidence" / "diagnostics"), str(target), str(exe)], check=True)
      - name: Upload ciphertext only
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-diagnostics-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/_emo_ciphertext/evidence.tar.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
